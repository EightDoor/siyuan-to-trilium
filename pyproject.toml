[project]
name = "siyuan-to-trilium"
version = "0.1.0"
description = "SiYuan → Trilium v0.105.0 原生数据库备份迁移工具"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]